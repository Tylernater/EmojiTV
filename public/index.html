<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emoji Face-Off</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#080b16;color:#fff;min-height:100vh}
button{font:inherit;border:0;cursor:pointer}.app{max-width:1200px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:24px;font-weight:900}.pill{padding:8px 12px;border-radius:999px;background:#151a2b;color:#b9c4df;font-size:13px}
.screen{display:none}.screen.active{display:block}.hero{text-align:center;padding:70px 20px}.hero h1{font-size:clamp(44px,8vw,82px);margin:0 0 12px}.hero p{color:#aeb7ce;font-size:18px}
.primary{background:#fff;color:#080b16;padding:15px 24px;border-radius:14px;font-weight:900;font-size:18px;margin-top:18px}.secondary{background:#151a2b;color:#fff;padding:12px 18px;border-radius:12px}
.card{background:#101525;border:1px solid #202a43;border-radius:20px;padding:18px}.status{text-align:center;margin:10px 0 18px;color:#aeb7ce}
.videos{display:grid;grid-template-columns:1fr 1fr;gap:16px}.videoCard{position:relative;background:#05070c;border-radius:18px;overflow:hidden;min-height:300px;border:1px solid #202a43}.videoCard video{width:100%;height:100%;min-height:300px;display:block;object-fit:cover;transform:scaleX(-1);background:#05070c}.videoCard.opponent video{transform:none}.label{position:absolute;top:12px;left:12px;background:#000b;padding:7px 10px;border-radius:10px;font-size:13px;z-index:2}.emoji{text-align:center;font-size:110px;margin:12px}.round{text-align:center;color:#aeb7ce;margin-bottom:10px}.controls{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}.notice{display:none;padding:14px;border-radius:14px;background:#2b1620;color:#ffd4df;margin:12px 0}.notice.show{display:block}.tiny{font-size:13px;color:#8994ad;text-align:center;margin-top:14px}.spinner{font-size:48px;text-align:center;animation:spin 1.2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:760px){.videos{grid-template-columns:1fr}.videoCard,.videoCard video{min-height:240px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">🎭 Emoji Face-Off</div><div class="pill" id="connection">Not connected</div></header>

<section id="home" class="screen active">
  <div class="hero">
    <div class="emoji">😎</div><h1>Emoji Face-Off</h1>
    <p>Copy the emoji. Beat your opponent. Win the round.</p>
    <button class="primary" id="play">PLAY NOW</button>
    <div class="tiny">Your camera stays on this page and is used for the game.</div>
  </div>
</section>

<section id="match" class="screen">
  <div class="card">
    <div class="spinner">⏳</div>
    <h2 style="text-align:center">Getting you into the game...</h2>
    <p class="status" id="matchStatus">Starting camera...</p>
    <div class="videos">
      <div class="videoCard"><span class="label">YOU</span><video id="localWaiting" autoplay muted playsinline></video></div>
      <div class="videoCard opponent"><span class="label">OPPONENT</span><video id="remoteWaiting" autoplay playsinline></video></div>
    </div>
    <div id="error" class="notice"></div>
    <div class="controls"><button class="secondary" id="cancel">CANCEL</button><button class="secondary" id="retry" style="display:none">RETRY</button></div>
  </div>
</section>

<section id="game" class="screen">
  <div class="round" id="roundText">Round 1 of 5</div>
  <div class="emoji" id="target">😎</div>
  <div class="videos">
    <div class="videoCard"><span class="label">YOU</span><video id="localGame" autoplay muted playsinline></video></div>
    <div class="videoCard opponent"><span class="label">OPPONENT</span><video id="remoteGame" autoplay playsinline></video></div>
  </div>
  <div class="controls"><button class="secondary" id="quit">QUIT GAME</button></div>
</section>
</div>

<script>
const $ = id => document.getElementById(id);
const screens = ["home","match","game"];
let stream = null, ws = null, pc = null, role = null, connecting = false;
let matchTimer = null;

function show(name){
  screens.forEach(x => $(x).classList.toggle("active", x === name));
}
function setError(text){
  $("error").textContent = text;
  $("error").classList.add("show");
  $("retry").style.display = "inline-block";
}
function clearError(){
  $("error").textContent = "";
  $("error").classList.remove("show");
  $("retry").style.display = "none";
}
function setLocalVideos(){
  if(!stream) return;
  ["localWaiting","localGame"].forEach(id => $(id).srcObject = stream);
}
function stopCamera(){
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  ["localWaiting","localGame"].forEach(id => $(id).srcObject = null);
}
async function getCameraAndMic(){
  // This function is ONLY responsible for camera/mic permission.
  if(!window.isSecureContext && location.hostname !== "localhost"){
    throw new Error("secure");
  }
  stream = await navigator.mediaDevices.getUserMedia({
    video:{width:{ideal:1280},height:{ideal:720},facingMode:"user"},
    audio:true
  });
  setLocalVideos();
  // Force the browser to render the camera immediately.
  await $("localWaiting").play().catch(()=>{});
  $("matchStatus").textContent = "Camera connected! Finding an opponent...";
}
function wsUrl(){
  if(location.protocol === "file:") return null;
  return (location.protocol === "https:" ? "wss://" : "ws://") + location.host;
}
function closeConnection(){
  if(ws){ try{ws.close();}catch{} ws=null; }
  if(pc){ try{pc.close();}catch{} pc=null; }
}
async function connectToServer(){
  if(connecting) return;
  connecting = true;
  clearError();
  const url = wsUrl();
  if(!url){
    connecting=false;
    throw new Error("file");
  }
  $("matchStatus").textContent = "Camera connected! Connecting to the game server...";
  return new Promise((resolve,reject)=>{
    let settled=false;
    const finish=(ok,err)=>{
      if(settled)return; settled=true; connecting=false;
      clearTimeout(timer);
      ok?resolve():reject(err);
    };
    ws = new WebSocket(url);
    const timer=setTimeout(()=>finish(false,new Error("timeout")),8000);
    ws.onopen=()=>{
      $("connection").textContent="Connected";
      $("matchStatus").textContent="Camera connected! Finding an opponent...";
      ws.send(JSON.stringify({type:"find-match"}));
      finish(true);
    };
    ws.onerror=()=>finish(false,new Error("server"));
    ws.onclose=()=>{
      $("connection").textContent="Not connected";
      if(!settled) finish(false,new Error("server"));
    };
    ws.onmessage=async e=>{
      let m; try{m=JSON.parse(e.data)}catch{return}
      if(m.type==="waiting") $("matchStatus").textContent="Camera is live ✓  Waiting for another player...";
      if(m.type==="matched"){
        role=m.role;
        $("matchStatus").textContent="Opponent found! Starting the game...";
        await setupPeer(role);
        show("game");
        setLocalVideos();
        setTimeout(()=>$("localGame").play().catch(()=>{}),50);
        $("target").textContent=["😎","😮","😡","😂","😐"][Math.floor(Math.random()*5)];
        $("roundText").textContent="Round 1 of 5";
      }
      if(m.type==="signal") handleSignal(m);
      if(m.type==="opponent-left"){
        closeConnection();
        $("matchStatus").textContent="Your opponent left. You can retry.";
        setError("Your opponent disconnected.");
        show("match");
      }
    };
  });
}
async function setupPeer(myRole){
  pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  pc.ontrack=e=>{
    const v=$("remoteGame");
    v.srcObject=e.streams[0];
    $("remoteWaiting").srcObject=e.streams[0];
    v.play().catch(()=>{});
  };
  pc.onicecandidate=e=>{
    if(e.candidate && ws?.readyState===1) ws.send(JSON.stringify({type:"signal",signal:{candidate:e.candidate}}));
  };
  if(myRole==="a"){
    const offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    ws.send(JSON.stringify({type:"signal",signal:{description:pc.localDescription}}));
  }
}
async function handleSignal(m){
  if(!pc) return;
  const s=m.signal;
  try{
    if(s.description){
      await pc.setRemoteDescription(s.description);
      if(s.description.type==="offer"){
        const answer=await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({type:"signal",signal:{description:pc.localDescription}}));
      }
    }else if(s.candidate){
      await pc.addIceCandidate(s.candidate);
    }
  }catch(err){ console.warn("WebRTC signal error",err); }
}
async function start(){
  show("match");
  clearError();
  $("matchStatus").textContent="Requesting camera and microphone...";
  $("connection").textContent="Camera starting...";
  try{
    // IMPORTANT: permission errors are caught separately.
    await getCameraAndMic();
  }catch(err){
    $("connection").textContent="Camera not connected";
    if(err?.name==="NotAllowedError"){
      setError("Camera/microphone access was blocked. Click the camera icon near your browser address bar and allow Camera and Microphone, then press RETRY.");
    }else if(err?.name==="NotFoundError"){
      setError("No camera or microphone was found. Check that your Logitech/FIFINE devices are plugged in.");
    }else if(err?.message==="secure"){
      setError("Open this game using http://localhost:3000. Do not double-click the HTML file.");
    }else{
      setError("We couldn't start the camera. Check your browser's camera and microphone permissions, then press RETRY.");
    }
    return;
  }

  // Camera is now definitely working and visible BEFORE server connection starts.
  $("connection").textContent="Camera connected";
  setLocalVideos();
  await new Promise(r=>setTimeout(r,150));
  $("localWaiting").scrollIntoView({block:"center",behavior:"smooth"});

  try{
    await connectToServer();
  }catch(err){
    $("connection").textContent="Server not connected";
    if(err.message==="file"){
      setError("You're viewing the HTML file directly. Start the game with npm start, then open http://localhost:3000.");
    }else{
      setError("Your camera is working, but the game server is not connected. Make sure the game was started with npm start, then press RETRY.");
    }
  }
}
$("play").onclick=start;
$("retry").onclick=start;
$("cancel").onclick=()=>{closeConnection();stopCamera();show("home");$("connection").textContent="Not connected";};
$("quit").onclick=()=>{if(ws?.readyState===1)ws.send(JSON.stringify({type:"leave"}));closeConnection();stopCamera();show("home");$("connection").textContent="Not connected";};
window.addEventListener("beforeunload",()=>{closeConnection();stopCamera()});
</script>
</body>
</html>
